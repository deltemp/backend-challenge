worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # `app` resolves to every replica once, when nginx starts. Dynamic re-resolution (the `resolve`
  # parameter) was tried and dropped: when a replica is killed, Docker removes its address while
  # nginx is still waiting on it, and the retry then fails with "no live upstreams". With a
  # static list, the request in flight is retried on a live replica instead. compose.yaml restarts
  # this proxy whenever it recreates the replicas, so their new addresses are picked up.
  upstream app {
    # A replica that fails once is skipped for 5 seconds, then tried again.
    server app:3000 max_fails=1 fail_timeout=5s;
    keepalive 32;
  }

  log_format json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"durationSeconds":$request_time,"upstream":"$upstream_addr",'
    '"correlationId":"$sent_http_x_correlation_id"}';
  access_log /dev/stdout json;

  server {
    listen 80;

    location / {
      # Replicas are on the local Docker network: a connection that takes longer than this
      # means a dead replica (a killed container drops packets instead of refusing them).
      proxy_connect_timeout 2s;
      # Move to another replica when one cannot be reached. nginx never resends a non-idempotent
      # request (POST) that already reached a replica, so this cannot duplicate a transaction.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 3;

      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
