# Prometheus configuration of the observability profile: the one grafana/otel-lgtm 0.41.1 ships
# (keep it in step when the image changes), plus a scrape job for the application replicas.
#
# Metrics are per process, so each replica is scraped on its own: Docker's DNS answers the
# service name `app` with the address of every replica. Never scrape through the proxy, which
# would hand each scrape to a different replica.
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: wagering-processor
    scrape_interval: 5s
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 3000
        refresh_interval: 5s
